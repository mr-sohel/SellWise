name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: .NET build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test SellWise.slnx --configuration Release

  ml:
    name: ML service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SellWise.ML
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: SellWise.ML/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
