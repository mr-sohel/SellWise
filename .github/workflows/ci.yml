name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: .NET build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test SellWise.slnx --configuration Release
