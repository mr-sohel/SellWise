# ─────────────────────────────────────────────────────────────────────────────
# SellWise production stack: SQL Server + web app behind Caddy.
# Only Caddy is reachable from the internet (80/443); the other services talk
# over the private 'sellwise-net' network.
#
#   cp .env.example .env   # fill in values
#   docker compose up -d --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sellwise-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_PID: "Express"
    volumes:
      - sellwise-data:/var/opt/mssql
    networks:
      - sellwise-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -C || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  sellwise-web:
    build: ./SellWise.Web
    container_name: sellwise-web
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=SellWise;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;"
      DataProtection__KeysPath: "/keys"
      DemoData__Enabled: "${DEMO_ENABLED:-false}"
      DemoData__AdminEmail: "${DEMO_EMAIL:-admin@sellwise.com}"
      DemoData__AdminPassword: "${DEMO_PASSWORD:-}"
    volumes:
      - sellwise-keys:/keys
    networks:
      - sellwise-net
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
    # No published ports: only Caddy can reach the app.

  caddy:
    image: caddy:2-alpine
    container_name: sellwise-caddy
    environment:
      DOMAIN: "${DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - sellwise-net
    depends_on:
      - sellwise-web
    restart: unless-stopped

networks:
  sellwise-net:

volumes:
  sellwise-data:   # SQL Server database files
  sellwise-keys:   # ASP.NET Core Data Protection keys (login cookies survive restarts)
  caddy-data:      # Let's Encrypt certificates
  caddy-config:
